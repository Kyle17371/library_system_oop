{% extends "base.html" %}{% block title %}Add Book{% endblock %}{% block content %}
<div class="page-head"><div><p class="eyebrow">COLLECTION</p><h1>Add a new book</h1><p class="muted">Create a title record and its first physical copy.</p></div></div>
<form method="post" class="panel form-grid"><label>Book title *<input name="title" required></label><label>ISBN<input name="isbn"></label><label>Author<input name="author"></label><label>Publisher<input name="publisher"></label><label>Publication year<input name="year" type="number" min="1000" max="2100"></label><label>Category<select name="category_id"><option value="">Choose category</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>First accession number *<input name="accession" required placeholder="e.g. LIB-2026-001"></label><label>Shelf location<input name="shelf_location" placeholder="e.g. A-01"></label><label>Additional copies<input name="extra_copies" type="number" min="0" max="50" value="0"></label><label class="span-two">Description<textarea name="description" rows="3"></textarea></label><div class="span-two"><button class="btn primary">Save book</button> <a class="btn outline" href="{{ url_for('catalog') }}">Cancel</a></div></form>
{% endblock %}
