{% extends "base.html" %}{% block title %}Library Settings{% endblock %}{% block content %}
<div class="page-head"><div><p class="eyebrow">POLICY</p><h1>Library settings</h1><p class="muted">Configure standard loan and overdue fine policies.</p></div></div>
<form method="post" class="panel form-grid"><label>Loan period (days)<input type="number" min="1" max="60" name="loan_days" value="{{ vals.loan_days }}" required></label><label>Fine per overdue day (₱)<input type="number" min="0" step="0.01" name="fine_per_day" value="{{ vals.fine_per_day }}" required></label><div class="span-two"><button class="btn primary">Save policies</button></div></form>
{% endblock %}
